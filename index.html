<!DOCTYPE html>
<html lang="nl" data-theme="auto" data-size="normal" data-font="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Het Spoor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- v0.13.0: refined paper-and-ink design system, single calm header, text-size/reading-font options, tabbed journal, WCAG AA landmarks and modal accessibility. Load order matters: content, library, engine, views, ui. -->
<a class="skip-link" href="#main">Ga naar inhoud</a>
<div id="app" hidden></div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden>
  <div class="mbox">
    <div class="mhead">
      <h2 id="mTitle"></h2>
      <button type="button" id="mClose">Sluiten</button>
    </div>
    <div id="mBody"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<script defer src="content.js"></script>
<script defer src="lib.js"></script>
<script defer src="engine.js"></script>
<script defer src="views.js"></script>
<script defer src="ui.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Het Spoor">
  <title>Het Spoor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#e3d7be"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#e7dec8" stop-opacity="0.74"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed ink canvas for maskable icon cropping -->
  <rect width="512" height="512" fill="#26201a"/>
  <!-- Safe zone (80% inner circle, radius ~190 around 256,256) -->
  <circle cx="256" cy="256" r="184" fill="url(#bg)" stroke="#c48a1c" stroke-width="6"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="#26201a" stroke-width="2.5" stroke-dasharray="9 7" opacity="0.32"/>

  <!-- Red investigation thread & pins -->
  <path d="M150 342 Q 204 274 238 238 T 346 156" fill="none" stroke="#9e2b25" stroke-width="10" stroke-linecap="round"/>
  <circle cx="150" cy="342" r="15" fill="#9e2b25" stroke="#26201a" stroke-width="5"/>
  <circle cx="346" cy="156" r="14" fill="#9e2b25" stroke="#26201a" stroke-width="5"/>

  <!-- Magnifying glass centered in safe zone -->
  <g stroke="#26201a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M294 294 L366 366" stroke="#26201a" stroke-width="32"/>
    <path d="M297 297 L363 363" stroke="#6f4324" stroke-width="18"/>
    <circle cx="236" cy="236" r="78" fill="url(#lens)" stroke="#26201a" stroke-width="18"/>
    <circle cx="236" cy="236" r="66" fill="none" stroke="#c48a1c" stroke-width="4"/>
    <path d="M196 198 A 54 54 0 0 1 256 184" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.85"/>
    <path d="M202 266 Q 224 244 238 230 T 274 208" fill="none" stroke="#9e2b25" stroke-width="11"/>
    <circle cx="238" cy="230" r="11" fill="#9e2b25" stroke="#26201a" stroke-width="4.5"/>
  </g>
</svg>

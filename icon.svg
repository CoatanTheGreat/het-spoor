<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Het Spoor">
  <title>Het Spoor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f2e7"/>
      <stop offset="100%" stop-color="#e3d7be"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#e7dec8" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <!-- Paper & ink dossier emblem -->
  <rect x="28" y="28" width="456" height="456" rx="92" fill="#26201a"/>
  <rect x="48" y="48" width="416" height="416" rx="74" fill="url(#bg)" stroke="#c48a1c" stroke-width="5"/>
  <rect x="66" y="66" width="380" height="380" rx="58" fill="none" stroke="#26201a" stroke-width="3" stroke-dasharray="10 8" opacity="0.35"/>

  <!-- Subtle notebook ruling -->
  <g stroke="#26201a" stroke-width="2.5" opacity="0.14">
    <line x1="108" y1="154" x2="356" y2="154"/>
    <line x1="108" y1="206" x2="394" y2="206"/>
    <line x1="108" y1="258" x2="394" y2="258"/>
    <line x1="108" y1="310" x2="320" y2="310"/>
    <line x1="108" y1="362" x2="290" y2="362"/>
  </g>

  <!-- Red investigation thread & pins -->
  <path d="M126 356 Q 192 276 232 232 T 364 134" fill="none" stroke="#9e2b25" stroke-width="11" stroke-linecap="round"/>
  <circle cx="126" cy="356" r="18" fill="#9e2b25" stroke="#26201a" stroke-width="6"/>
  <circle cx="121" cy="351" r="4.5" fill="#f7f2e7"/>
  <circle cx="364" cy="134" r="16" fill="#9e2b25" stroke="#26201a" stroke-width="6"/>
  <circle cx="360" cy="130" r="4" fill="#f7f2e7"/>

  <!-- Magnifying glass (woodcut ink & brass) -->
  <g stroke="#26201a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle -->
    <path d="M300 304 L388 392" stroke="#26201a" stroke-width="38"/>
    <path d="M304 308 L384 388" stroke="#6f4324" stroke-width="22"/>
    <path d="M312 308 L342 338" stroke="#c48a1c" stroke-width="8" opacity="0.75"/>
    <!-- Rim & lens -->
    <circle cx="228" cy="230" r="96" fill="url(#lens)" stroke="#26201a" stroke-width="22"/>
    <circle cx="228" cy="230" r="82" fill="none" stroke="#c48a1c" stroke-width="5"/>
    <!-- Highlight & trail clue inside lens -->
    <path d="M180 184 A 66 66 0 0 1 252 166" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.85"/>
    <path d="M186 266 Q 214 238 232 222 T 274 196" fill="none" stroke="#9e2b25" stroke-width="13"/>
    <circle cx="232" cy="222" r="13" fill="#9e2b25" stroke="#26201a" stroke-width="5"/>
  </g>
</svg>
